---
layout: default
---
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<article class="post">

  <header class="post-header">
    <h1>{{ page.title }}</h1>

    <p class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
    </p>

    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <a class="tag" href="/tags/#{{ tag }}">#{{ tag }}</a>
      {% endfor %}
    </div>
    {% endif %}

  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
